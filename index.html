/* ------------------------------------------------------------
   Sustituto de window.storage (solo disponible dentro de
   claude.ai) usando localStorage del navegador. Cada estudiante
   guarda su propia copia de los datos de Terrapesos en su
   propio navegador, igual que la versión original de
   terrapesos_web.html.
   ------------------------------------------------------------ */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    },
  };
}

  --text-muted: #A6A8BE;
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
.pf-app * { box-sizing: border-box; }
.pf-serif { font-family: 'Fraunces', serif; }
.pf-container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* NAV */
.pf-nav { position: sticky; top: 0; z-index: 40; background: rgba(20,21,31,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.pf-nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.pf-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; }
.pf-logo-mark { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(155deg, var(--gold-soft), var(--gold)); display: flex; align-items: center; justify-content: center; color: var(--ink); font-weight: 700; font-family: 'Fraunces', serif; font-size: 18px; }
.pf-logo-text { text-align: left; }
.pf-logo-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.2px; color: var(--text); }
.pf-logo-sub { font-size: 11.5px; color: var(--text-muted); margin-top: -2px; }
.pf-nav-links { display: none; gap: 4px; }
.pf-nav-link { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 7px; border: none; background: none; color: var(--text-muted); font-size: 14px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: color .15s, background .15s; }
.pf-nav-link:hover { color: var(--text); background: var(--ink-3); }
.pf-nav-link.active { color: var(--ink); background: var(--gold-soft); font-weight: 600; }
.pf-nav-right { display: flex; align-items: center; gap: 8px; }
.pf-search-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--ink-2); color: var(--text-muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-family: inherit; }
.pf-search-btn:hover { border-color: var(--gold); color: var(--text); }
.pf-menu-btn { display: flex; background: none; border: none; color: var(--text); cursor: pointer; padding: 6px; }
@media (min-width: 900px) {
  .pf-nav-links { display: flex; }
  .pf-menu-btn { display: none; }
}
.pf-mobile-menu { border-top: 1px solid var(--border); background: var(--ink-2); }
.pf-mobile-menu .pf-nav-link { width: 100%; justify-content: flex-start; padding: 13px 24px; border-radius: 0; }

/* SEARCH OVERLAY */
.pf-search-overlay { position: fixed; inset: 0; background: rgba(10,10,16,0.72); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 80px 20px; }
.pf-search-panel { background: var(--ink-2); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 640px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.pf-search-input-row { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.pf-search-input-row input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; font-family: inherit; }
.pf-search-input-row input::placeholder { color: var(--text-muted); }

/* HERO */
.pf-hero { padding: 64px 0 56px; border-bottom: 1px solid var(--border); }
.pf-eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--gold-soft); font-size: 13.5px; margin-bottom: 18px; }
.pf-hero h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(32px, 5vw, 52px); line-height: 1.08; max-width: 780px; margin: 0 0 20px; letter-spacing: -0.5px; }
.pf-hero p.pf-lede { font-size: 17px; color: var(--text-muted); max-width: 560px; margin: 0 0 30px; }
.pf-btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.pf-btn { font-family: inherit; font-size: 14.5px; font-weight: 600; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; transition: transform .12s, filter .12s; }
.pf-btn:hover { filter: brightness(1.08); }
.pf-btn:active { transform: translateY(1px); }
.pf-btn-primary { background: var(--gold-soft); color: var(--ink); }
.pf-btn-secondary { background: none; border-color: var(--border); color: var(--text); }
.pf-btn-secondary:hover { border-color: var(--gold); }

/* SECTION */
.pf-section { padding: 56px 0; border-bottom: 1px solid var(--border); }
.pf-section:last-child { border-bottom: none; }
.pf-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
.pf-section-head h2 { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 600; margin: 0; }
.pf-section-head p { color: var(--text-muted); font-size: 14.5px; margin: 6px 0 0; }
.pf-link-more { color: var(--gold-soft); font-size: 13.5px; display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }

/* GRID + CARDS */
.pf-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.pf-grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.pf-card { background: var(--ink-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; font-family: inherit; color: var(--text); }
.pf-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.pf-card.disabled { opacity: 0.55; cursor: default; }
.pf-card.disabled:hover { border-color: var(--border); transform: none; }
.pf-card h3 { font-family: 'Fraunces', serif; font-size: 17.5px; font-weight: 600; margin: 0 0 6px; }
.pf-card p { font-size: 13.5px; color: var(--text-muted); margin: 0; }
.pf-tag { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--ink-3); color: var(--gold-soft); border: 1px solid var(--border); margin-bottom: 10px; letter-spacing: 0.2px; }
.pf-tag.teal { color: var(--teal); }

/* TABS */
.pf-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.pf-tab { background: none; border: none; color: var(--text-muted); padding: 10px 4px; margin-right: 22px; font-size: 15px; font-family: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.pf-tab.active { color: var(--text); border-color: var(--gold); font-weight: 600; }

/* BREADCRUMB */
.pf-breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
.pf-breadcrumb button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 13px; padding: 2px 0; }
.pf-breadcrumb button:hover { color: var(--gold-soft); }
.pf-breadcrumb .current { color: var(--text); }

/* PROCESS DIAGRAM */
.pf-process { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.pf-process-step { flex: 1; min-width: 150px; background: var(--ink-2); border: 1px solid var(--border); padding: 18px 16px; position: relative; }
.pf-process-step:first-child { border-radius: 10px 0 0 10px; }
.pf-process-step:last-child { border-radius: 0 10px 10px 0; }
.pf-process-step + .pf-process-step { border-left: none; }
.pf-process-num { font-family: 'Fraunces', serif; font-size: 13px; color: var(--gold-soft); margin-bottom: 8px; }
.pf-process-step h4 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
.pf-process-step p { margin: 0; font-size: 12.5px; color: var(--text-muted); }

/* TOPIC DETAIL */
.pf-topic-block { margin-bottom: 30px; }
.pf-topic-block h3 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 10px; }
.pf-topic-block p, .pf-topic-block li { font-size: 14.5px; color: var(--text-muted); line-height: 1.65; }
.pf-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pf-chip { font-size: 12.5px; padding: 5px 12px; border-radius: 20px; background: var(--ink-3); border: 1px solid var(--border); color: var(--text); }
.pf-resource-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--ink-2); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; }
.pf-resource-row .ico { color: var(--gold-soft); flex-shrink: 0; }
.pf-resource-row .meta { font-size: 12px; color: var(--text-muted); }

/* FILTER BAR */
.pf-filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; align-items: center; }
.pf-select, .pf-input { background: var(--ink-2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-family: inherit; }
.pf-input { flex: 1; min-width: 200px; }

/* FLASHCARD */
.pf-flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px 0 10px; }
.pf-flashcard { width: 100%; max-width: 520px; min-height: 220px; background: var(--ink-2); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px; cursor: pointer; position: relative; }
.pf-flashcard:hover { border-color: var(--gold); }
.pf-flashcard .face-label { position: absolute; top: 16px; left: 20px; font-size: 11px; letter-spacing: 0.5px; color: var(--gold-soft); }
.pf-flashcard .txt { font-family: 'Fraunces', serif; font-size: 19px; line-height: 1.5; }
.pf-flashcard.back .txt { font-family: 'IBM Plex Sans', sans-serif; font-size: 15.5px; color: var(--text-muted); }
.pf-flash-controls { display: flex; align-items: center; gap: 16px; }
.pf-icon-btn { background: var(--ink-2); border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pf-icon-btn:hover { border-color: var(--gold); }
.pf-flash-counter { font-size: 13px; color: var(--text-muted); min-width: 56px; text-align: center; }

/* QUIZ */
.pf-quiz-q { font-family: 'Fraunces', serif; font-size: 17.5px; margin: 0 0 16px; }
.pf-quiz-opt { display: block; width: 100%; text-align: left; background: var(--ink-2); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 9px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: 14px; }
.pf-quiz-opt:hover { border-color: var(--gold); }
.pf-quiz-opt.correct { border-color: #6FAE8F; background: rgba(111,174,143,0.14); }
.pf-quiz-opt.incorrect { border-color: #C9695F; background: rgba(201,105,95,0.14); }
.pf-quiz-fb { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 9px; background: var(--ink-3); margin-top: 12px; font-size: 13.5px; color: var(--text-muted); }

/* AUTHOR */
.pf-author-hero { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 30px; }
.pf-author-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(155deg, var(--teal), var(--ink-3)); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 24px; color: var(--text); flex-shrink: 0; }

/* MISC */
.pf-muted { color: var(--text-muted); }
.pf-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.pf-progress-track { width: 100%; height: 8px; border-radius: 6px; background: var(--ink-3); overflow: hidden; margin: 6px 0 4px; }
.pf-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold-soft)); border-radius: 6px; }
textarea.pf-reflection { width: 100%; background: var(--ink-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 12px; font-family: inherit; font-size: 14px; min-height: 90px; resize: vertical; }
.pf-quote-block { display: flex; gap: 14px; padding: 22px 24px; background: var(--ink-2); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 4px; }
.pf-quote-block p { font-family: 'Fraunces', serif; font-size: 17px; font-style: italic; margin: 0; color: var(--text); }
footer.pf-footer { padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 12.5px; }

/* TERRAPESOS */
.pf-tp-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.pf-tp-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 720px) { .pf-tp-columns { grid-template-columns: 1fr; } }
.pf-tp-col-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 0 0 3px; }
.pf-tp-col-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.45; }
.pf-tp-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pf-tp-item:last-of-type { border-bottom: none; }
.pf-tp-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.pf-tp-body { flex: 1; min-width: 0; }
.pf-tp-label { font-size: 14.5px; line-height: 1.35; }
.pf-tp-note { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.pf-tp-price { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15.5px; white-space: nowrap; min-width: 56px; text-align: right; color: var(--gold-soft); }
.pf-tp-edit-input { background: var(--ink-3); border: 1px dashed var(--border); border-radius: 5px; color: var(--text); font-family: inherit; padding: 4px 7px; font-size: 13px; width: 100%; }
.pf-tp-edit-input.price { text-align: right; width: 70px; }
.pf-tp-remove { background: none; border: none; color: #C9695F; font-size: 18px; line-height: 1; padding: 2px 4px; cursor: pointer; flex-shrink: 0; }
.pf-tp-add-row { font-size: 12.5px; color: var(--gold-soft); background: none; border: 1px dashed var(--gold-soft); border-radius: 6px; padding: 7px 12px; margin-top: 10px; cursor: pointer; font-family: inherit; }
.pf-tp-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 11.5px; color: var(--text-muted); }
.pf-tp-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pf-tp-group { margin-bottom: 22px; }
.pf-tp-group:last-child { margin-bottom: 0; }
.pf-tp-group-title { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-family: 'Fraunces', serif; }
.pf-tp-group-freq { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 11.5px; color: var(--text-muted); }
.pf-tp-callout-text { font-size: 13.5px; line-height: 1.55; color: var(--text); }
.pf-quote-block.warn { border-left-color: #C9695F; background: rgba(201,105,95,0.08); }
.pf-tp-item.danger .pf-tp-price { color: #D2695C; }
.pf-tp-item.danger { border-bottom-color: rgba(201,105,95,0.2); }
`;

/* ============================================================
   COMPONENTES AUXILIARES
   ============================================================ */

function Breadcrumb({ items }) {
  return (
    <div className="pf-breadcrumb">
      {items.map((it, i) => (
        <React.Fragment key={i}>
          {i > 0 && <ChevronRight size={13} />}
          {it.onClick ? (
            <button onClick={it.onClick}>{it.label}</button>
          ) : (
            <span className="current">{it.label}</span>
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function ResourceRow({ r, onOpen }) {
  const meta = TIPOS_RECURSO[r.tipo] || TIPOS_RECURSO.documento;
  const Ico = meta.icon;
  return (
    <div className="pf-resource-row">
      <Ico size={18} className="ico" />
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 14, fontWeight: 500 }}>{r.titulo}</div>
        <div className="meta">{meta.label} · {r.curso} · {r.unidad}</div>
      </div>
      <button className="pf-btn pf-btn-secondary" style={{ padding: "7px 14px", fontSize: 13 }} onClick={() => onOpen(r)}>
        Abrir
      </button>
    </div>
  );
}

/* ============================================================
   APP PRINCIPAL
   ============================================================ */

function PlataformaFilosofia() {
  const [view, setView] = useState({ page: "home" });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [resourceFilters, setResourceFilters] = useState({ tipo: "todos", texto: "" });
  const [nivelTab, setNivelTab] = useState("4° Medio");
  const [flashIndex, setFlashIndex] = useState(0);
  const [flashFlipped, setFlashFlipped] = useState(false);
  const [quizAnswers, setQuizAnswers] = useState({});
  const [toast, setToast] = useState(null);

  // ---- Terrapesos: estado y persistencia compartida ----
  const [tpData, setTpData] = useState(TERRAPESOS_DEFAULT);
  const [tpLoaded, setTpLoaded] = useState(false);
  const [tpTab, setTpTab] = useState("cambio");
  const [tpEditing, setTpEditing] = useState(false);
  const [tpSnapshot, setTpSnapshot] = useState(null);
  const [tpAskingPin, setTpAskingPin] = useState(false);
  const [tpPinInput, setTpPinInput] = useState("");
  const [tpPinError, setTpPinError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(TERRAPESOS_STORAGE_KEY, true);
        if (res && res.value) {
          const saved = JSON.parse(res.value);
          // Si hay datos guardados de una versión anterior (por ejemplo, sin la
          // sección "multas"), se completa con los valores por defecto en vez
          // de dejar propiedades faltantes que rompan el resto de la pantalla.
          const merged = { ...TERRAPESOS_DEFAULT, ...saved };
          setTpData(merged);
        }
      } catch (e) {
        // sin datos guardados todavía: se usan los valores por defecto
      } finally {
        setTpLoaded(true);
      }
    })();
  }, []);

  const tpRequestEdit = () => {
    setTpPinInput("");
    setTpPinError(false);
    setTpAskingPin(true);
  };
  const tpConfirmPin = () => {
    if (tpPinInput === TERRAPESOS_EDIT_PIN) {
      setTpAskingPin(false);
      tpStartEdit();
    } else {
      setTpPinError(true);
    }
  };
  const tpStartEdit = () => {
    setTpSnapshot(JSON.parse(JSON.stringify(tpData)));
    setTpEditing(true);
  };
  const tpCancelEdit = () => {
    setTpData(tpSnapshot);
    setTpEditing(false);
  };
  const tpSave = async () => {
    setTpEditing(false);
    try {
      await window.storage.set(TERRAPESOS_STORAGE_KEY, JSON.stringify(tpData), true);
      setToast("Cambios de Terrapesos guardados ✓ (solo en este navegador)");
    } catch (e) {
      setToast("No se pudo guardar. Intenta nuevamente.");
    }
  };
  const tpReset = async () => {
    setTpData(TERRAPESOS_DEFAULT);
    setTpEditing(false);
    try {
      await window.storage.set(TERRAPESOS_STORAGE_KEY, JSON.stringify(TERRAPESOS_DEFAULT), true);
      setToast("Valores de Terrapesos restablecidos");
    } catch (e) {}
  };

  const tpUpdateListItem = (listKey, index, field, value) => {
    setTpData((d) => {
      const next = { ...d, [listKey]: [...d[listKey]] };
      next[listKey][index] = { ...next[listKey][index], [field]: value };
      return next;
    });
  };
  const tpAddListItem = (listKey, withTier, preset) => {
    setTpData((d) => ({
      ...d,
      [listKey]: [...d[listKey], preset || (withTier ? { tier: "d1000", label: "Nuevo beneficio", note: "", price: "1.000" } : { label: "Nuevo beneficio", note: "", price: "1.000" })],
    }));
  };
  const tpRemoveListItem = (listKey, index) => {
    setTpData((d) => ({ ...d, [listKey]: d[listKey].filter((_, i) => i !== index) }));
  };

  const tpUpdateGroupItem = (groupKey, index, field, value) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: [...d[groupKey].items] };
      group.items[index] = { ...group.items[index], [field]: value };
      return { ...d, [groupKey]: group };
    });
  };
  const tpAddGroupItem = (groupKey) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: [...d[groupKey].items, { label: "Nueva actividad", note: "", price: "1.000" }] };
      return { ...d, [groupKey]: group };
    });
  };
  const tpRemoveGroupItem = (groupKey, index) => {
    setTpData((d) => {
      const group = { ...d[groupKey], items: d[groupKey].items.filter((_, i) => i !== index) };
      return { ...d, [groupKey]: group };
    });
  };

  const nav = (page, params = {}) => {
    setView({ page, ...params });
    setMobileOpen(false);
    setSearchOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const runSearch = (q) => {
    setQuery(q);
    nav("busqueda", { q });
  };

  const searchResults = useMemo(() => {
    const q = (view.q || "").toLowerCase().trim();
    if (!q) return { recursos: [], autores: [], conceptos: [] };
    return {
      recursos: RECURSOS.filter((r) => (r.titulo + r.descripcion + r.curso + r.unidad).toLowerCase().includes(q)),
      autores: AUTORES.filter((a) => a.nombre.toLowerCase().includes(q)),
      conceptos: CONCEPTOS.filter((c) => c.toLowerCase().includes(q)),
    };
  }, [view.q]);

  const filteredResources = useMemo(() => {
    return RECURSOS.filter((r) => {
      const okTipo = resourceFilters.tipo === "todos" || r.tipo === resourceFilters.tipo;
      const okTexto = !resourceFilters.texto || (r.titulo + r.descripcion).toLowerCase().includes(resourceFilters.texto.toLowerCase());
      return okTipo && okTexto;
    });
  }, [resourceFilters]);

  /* ---------- NAV ---------- */

  const Nav = () => (
    <nav className="pf-nav">

        </div>
        <div className="pf-topic-block"><h3>Biografía breve</h3><p>{autor.bio}</p></div>
        <div className="pf-topic-block"><h3>Contexto histórico</h3><p>{autor.contexto}</p></div>
        <div className="pf-topic-block">
          <h3>Principales obras</h3>
          <ul style={{ paddingLeft: 18 }}>{autor.obras.map((o) => <li key={o}>{o}</li>)}</ul>
        </div>
        <div className="pf-topic-block">
          <h3>Conceptos fundamentales</h3>
          <div className="pf-chip-row">{autor.conceptos.map((c) => <span className="pf-chip" key={c}>{c}</span>)}</div>
        </div>
        <div className="pf-topic-block"><h3>Ética</h3><p>{autor.etica}</p></div>
        <div className="pf-topic-block"><h3>Política</h3><p>{autor.politica}</p></div>
        <div className="pf-topic-block">
          <h3>Preguntas para estudiar</h3>
          <ul style={{ paddingLeft: 18 }}>{autor.preguntas.map((p, i) => <li key={i}>{p}</li>)}</ul>
        </div>
      </div>
    );
  };

  const Busqueda = () => {
    const { recursos, autores, conceptos } = searchResults;
    const total = recursos.length + autores.length + conceptos.length;
    return (
      <div className="pf-container pf-section" style={{ paddingTop: 44 }}>
        <h2 className="pf-serif" style={{ fontSize: 26, marginBottom: 6 }}>Resultados para "{view.q}"</h2>
        <p className="pf-muted" style={{ marginBottom: 30 }}>{total} resultado{total !== 1 ? "s" : ""} encontrado{total !== 1 ? "s" : ""}.</p>
        {total === 0 && <Empty text="No encontramos coincidencias. Prueba con otro autor o concepto." />}
        {conceptos.length > 0 && (
          <div className="pf-topic-block">
            <h3>Conceptos</h3>
            <div className="pf-chip-row">{conceptos.map((c) => <span className="pf-chip" key={c}>{c}</span>)}</div>
          </div>
        )}
        {autores.length > 0 && (
          <div className="pf-topic-block">
            <h3>Autores</h3>
            <div className="pf-grid">
              {autores.map((a) => (
                <button key={a.id} className="pf-card" onClick={() => nav("autor", { autorId: a.id })}>
                  <h3 style={{ fontSize: 15.5 }}>{a.nombre}</h3><p>{a.epoca}</p>
                </button>
              ))}
            </div>
          </div>
        )}
        {recursos.length > 0 && (
          <div className="pf-topic-block">
            <h3>Recursos</h3>
            {recursos.map((r) => <ResourceRow key={r.id} r={r} onOpen={() => setToast(`Contenido de ejemplo: aquí se abriría "${r.titulo}".`)} />)}
          </div>
        )}
      </div>
    );
  };

  const Sobre = () => (
    <div className="pf-container pf-section" style={{ paddingTop: 44, maxWidth: 720 }}>
      <h2 className="pf-serif" style={{ fontSize: 27, marginBottom: 14 }}>Sobre la asignatura</h2>
      <p className="pf-muted" style={{ marginBottom: 16 }}>
        Contenido de ejemplo: esta asignatura busca que los estudiantes desarrollen pensamiento crítico y capacidad
        argumentativa a través del estudio de las grandes preguntas filosóficas, desde la Antigüedad hasta el
        presente, con especial énfasis en la filosofía política y ética.
      </p>
      <p className="pf-muted" style={{ marginBottom: 16 }}>
        A lo largo del año se trabajará con lecturas de fuente primaria, análisis de casos contemporáneos y
        actividades de argumentación oral y escrita.
      </p>
      <div className="pf-topic-block" style={{ marginTop: 24 }}>
        <h3>Evaluación</h3>
        <p>Contenido de ejemplo: la evaluación combina pruebas de contenidos, ensayos filosóficos y participación en debates guiados.</p>
      </div>
    </div>
  );

  const Terrapesos = () => {
    const d = tpData;

    const TpEditableText = ({ value, onChange }) => {
      if (!tpEditing) return <p className="pf-tp-callout-text">{value}</p>;
      return <textarea className="pf-reflection" value={value} onChange={(e) => onChange(e.target.value)} />;
    };

    const TpRow = ({ item, tier, danger, onChangeField, onRemove }) => (
      <div className={"pf-tp-item" + (danger ? " danger" : "")}>
        {tier && <div className="pf-tp-dot" style={{ background: TERRAPESOS_TIERS[tier]?.hex || "#8FAE5D" }} />}
        <div className="pf-tp-body">
          {tpEditing ? (
            <>
              <input className="pf-tp-edit-input" value={item.label} onChange={(e) => onChangeField("label", e.target.value)} />
              <input className="pf-tp-edit-input" style={{ marginTop: 5 }} placeholder="Nota (opcional)" value={item.note || ""} onChange={(e) => onChangeField("note", e.target.value)} />
            </>
          ) : (
            <>
              <div className="pf-tp-label">{item.label}</div>
              {item.note && <div className="pf-tp-note">{item.note}</div>}
            </>
          )}
        </div>
        {tpEditing ? (
          <input className="pf-tp-edit-input price" value={item.price} onChange={(e) => onChangeField("price", e.target.value)} />
        ) : (
          <div className="pf-tp-price">{item.price}</div>
        )}
        {tpEditing && <button className="pf-tp-remove" onClick={onRemove}>×</button>}
      </div>
    );

    return (
      <div className="pf-container pf-section" style={{ paddingTop: 44 }}>
        <div className="pf-section-head">
          <div>
            <h2>Terrapesos</h2>
            <p>Sistema de incentivos del curso · Colegio Quillota Terranova · Banco Terranova</p>
          </div>
        </div>

        <p className="pf-muted" style={{ fontSize: 12, marginBottom: 14 }}>
          En esta versión, los cambios que hagas en "Editar contenido" se guardan solo en este navegador, no se comparten entre estudiantes.
        </p>
        <div className="pf-tp-toolbar">
          {!tpEditing ? (
            <button className="pf-btn pf-btn-secondary" onClick={tpRequestEdit}><Pencil size={15} /> Editar contenido</button>
          ) : (
            <>
              <button className="pf-btn pf-btn-primary" onClick={tpSave}><Save size={15} /> Guardar cambios</button>
              <button className="pf-btn pf-btn-secondary" onClick={tpCancelEdit}>Cancelar</button>
              <button className="pf-btn pf-btn-secondary" onClick={tpReset}>Restablecer valores originales</button>
            </>
          )}
        </div>

        <div className="pf-tabs">
          <button className={"pf-tab" + (tpTab === "cambio" ? " active" : "")} onClick={() => setTpTab("cambio")}>Casa de Cambio</button>
          <button className={"pf-tab" + (tpTab === "ganar" ? " active" : "")} onClick={() => setTpTab("ganar")}>Cómo se ganan</button>
          <button className={"pf-tab" + (tpTab === "multas" ? " active" : "")} onClick={() => setTpTab("multas")}>Multas</button>
        </div>

        {tpTab === "cambio" && (
          <>
            <div className="pf-tp-columns">
              <div>
                <div className="pf-tp-col-title">Beneficios individuales</div>
                <div className="pf-tp-col-desc">Se pagan con tus propios terrapesos, cuando quieras canjearlos.</div>
                {d.individual.map((item, i) => (
                  <TpRow key={i} item={item} tier={item.tier} onChangeField={(f, v) => tpUpdateListItem("individual", i, f, v)} onRemove={() => tpRemoveListItem("individual", i)} />
                ))}
                {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("individual", true)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar beneficio</button>}
              </div>
              <div>
                <div className="pf-tp-col-title">Beneficios en grupo</div>
                <div className="pf-tp-col-desc">Se juntan entre varios estudiantes, aportando terrapesos cada uno.</div>
                {d.grupo.map((item, i) => (
                  <TpRow key={i} item={item} tier={item.tier} onChangeField={(f, v) => tpUpdateListItem("grupo", i, f, v)} onRemove={() => tpRemoveListItem("grupo", i)} />
                ))}
                {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("grupo", true)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar beneficio</button>}
                <div className="pf-tp-legend">
                  {Object.entries(TERRAPESOS_TIERS).map(([k, v]) => (
                    <span key={k}><div className="pf-tp-dot" style={{ background: v.hex }} />{v.label}</span>
                  ))}
                </div>
              </div>
            </div>
            <div className="pf-quote-block" style={{ marginTop: 22, alignItems: "flex-start" }}>
              <Coins size={20} color="#C9A227" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Ejemplo</div>
                <TpEditableText value={d.exampleText} onChange={(v) => setTpData((s) => ({ ...s, exampleText: v }))} />
              </div>
            </div>
          </>
        )}

        {tpTab === "ganar" && (
          <>
            <div className="pf-quote-block" style={{ marginBottom: 26, alignItems: "flex-start" }}>
              <Coins size={20} color="#C9A227" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Importante</div>
                <TpEditableText value={d.importantText} onChange={(v) => setTpData((s) => ({ ...s, importantText: v }))} />
              </div>
            </div>

            {["g1", "g2", "g3", "g4"].map((gk) => {
              const group = d[gk];
              return (
                <div className="pf-tp-group" key={gk}>
                  <div className="pf-tp-group-title">
                    <div className="pf-tp-dot" style={{ background: TERRAPESOS_TIERS[group.tier]?.hex || "#8FAE5D" }} />
                    {group.titulo}
                    {group.frecuencia && <span className="pf-tp-group-freq">({group.frecuencia})</span>}
                  </div>
                  {group.items.map((item, i) => (
                    <TpRow key={i} item={item} tier={null} onChangeField={(f, v) => tpUpdateGroupItem(gk, i, f, v)} onRemove={() => tpRemoveGroupItem(gk, i)} />
                  ))}
                  {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddGroupItem(gk)}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar</button>}
                </div>
              );
            })}

            <div className="pf-quote-block" style={{ marginTop: 8, alignItems: "flex-start" }}>
              <Info size={20} color="#C9A227" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6 }}>Cómo funciona</div>
                <TpEditableText value={d.funcionaText} onChange={(v) => setTpData((s) => ({ ...s, funcionaText: v }))} />
              </div>
            </div>
          </>
        )}

        {tpTab === "multas" && (
          <>
            <div className="pf-quote-block warn" style={{ marginBottom: 26, alignItems: "flex-start" }}>
              <Info size={20} color="#D2695C" style={{ flexShrink: 0, marginTop: 3 }} />
              <div style={{ flex: 1 }}>
                <div className="pf-eyebrow" style={{ marginBottom: 6, color: "#D2695C" }}>Importante</div>
                <TpEditableText value={d.multasImportantText} onChange={(v) => setTpData((s) => ({ ...s, multasImportantText: v }))} />
              </div>
            </div>
            <div className="pf-tp-col-title">Multas</div>
            <div className="pf-tp-col-desc">Se descuentan de tus terrapesos acumulados cuando corresponda.</div>
            {d.multas.map((item, i) => (
              <TpRow key={i} item={item} tier={null} danger onChangeField={(f, v) => tpUpdateListItem("multas", i, f, v)} onRemove={() => tpRemoveListItem("multas", i)} />
            ))}
            {tpEditing && <button className="pf-tp-add-row" onClick={() => tpAddListItem("multas", false, { label: "Nueva multa", note: "", price: "-1.000" })}><Plus size={13} style={{ verticalAlign: -2 }} /> Agregar multa</button>}
          </>
        )}

        {!tpLoaded && <p className="pf-muted" style={{ marginTop: 18, fontSize: 12.5 }}>Cargando valores guardados…</p>}

        {tpAskingPin && (
          <div className="pf-search-overlay" onClick={() => setTpAskingPin(false)}>
            <div className="pf-search-panel" style={{ maxWidth: 380 }} onClick={(e) => e.stopPropagation()}>
              <div style={{ padding: "22px 22px 6px" }}>
                <h3 className="pf-serif" style={{ fontSize: 18, margin: "0 0 6px" }}>Modo edición · Terrapesos</h3>
                <p className="pf-muted" style={{ fontSize: 13, margin: "0 0 16px" }}>Ingresa la clave del profesor o profesora para editar los valores.</p>
                <input
                  autoFocus
                  type="password"
                  className="pf-input"
                  style={{ width: "100%", marginBottom: 8 }}
                  placeholder="Clave"
                  value={tpPinInput}
                  onChange={(e) => { setTpPinInput(e.target.value); setTpPinError(false); }}
                  onKeyDown={(e) => e.key === "Enter" && tpConfirmPin()}
                />
                {tpPinError && <p style={{ color: "#C9695F", fontSize: 12.5, margin: "0 0 10px" }}>Clave incorrecta. Intenta nuevamente.</p>}
              </div>
              <div style={{ display: "flex", gap: 10, padding: "10px 22px 22px" }}>
                <button className="pf-btn pf-btn-primary" onClick={tpConfirmPin}>Entrar</button>
                <button className="pf-btn pf-btn-secondary" onClick={() => setTpAskingPin(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  };

  function Empty({ text, onBack }) {
    return (
      <div className="pf-empty">
        <p>{text}</p>
        {onBack && <button className="pf-btn pf-btn-secondary" style={{ marginTop: 14 }} onClick={onBack}>Volver</button>}
      </div>
    );
  }

  const PAGES = {
    home: Home, inicio: Home,
    cursos: Cursos,
    curso: CursoDetalle,
    unidad: UnidadDetalle,
    tema: TemaDetalle,
    recursos: Recursos,
    estudio: ModoEstudio,
    flashcards: Flashcards,
    paes: Paes,
    biblioteca: Biblioteca,
    autor: AutorDetalle,
    busqueda: Busqueda,
    terrapesos: Terrapesos,
    sobre: Sobre,
  };

  const Page = PAGES[view.page] || Home;

  return (
    <div className="pf-app">
      <style>{STYLES}</style>
      <Nav />
      <SearchOverlay />
      <Page />
      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#262939", border: "1px solid #333650", color: "#F1EEE4", padding: "12px 18px", borderRadius: 10, fontSize: 13.5, zIndex: 80, maxWidth: "90%", textAlign: "center" }}>
          {toast}
          <button style={{ marginLeft: 12, background: "none", border: "none", color: "#A6A8BE", cursor: "pointer" }} onClick={() => setToast(null)}>✕</button>
        </div>
      )}
      <footer className="pf-footer pf-container">
        {NOMBRE_PLATAFORMA} · Plataforma de apoyo pedagógico para Filosofía · Versión inicial con contenido de ejemplo
      </footer>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<PlataformaFilosofia />);
</script>
</body>
</html>
